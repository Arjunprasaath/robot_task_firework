[project]
name = "ml45-bench"
version = "0.1.0"
description = "ML45 held-out benchmark for VLM robot policies on MetaWorld, served on Fireworks"
requires-python = ">=3.11,<3.13"
dependencies = [
    "metaworld==3.1.1",
    "mujoco==3.3.0",
    "gymnasium==1.3.0",
    "numpy>=2.0,<2.3",
    "pillow==11.3.0",
    "pyarrow>=17",
    "packaging",
    "imageio[ffmpeg]>=2.34",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml45bench"]
